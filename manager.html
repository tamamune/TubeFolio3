<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TubeFolio3</title>
<link rel="icon" href="icons/icon-32.png">
<link rel="stylesheet" href="src/manager.css">
</head>
<body>
<div id="app">
  <aside id="side" class="panel">
    <div class="side-head">
      <span class="brand">TubeFolio3</span>
      <img class="logo" src="icons/icon-128.png" alt="">

      <button id="collapse" class="icon-btn" title="サイドバーを閉じる/開く" aria-label="サイドバーを閉じる/開く">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <nav id="folders"></nav>
    <button id="add-folder" class="primary-btn" title="新規フォルダ">
      <span class="plus">＋</span><span class="lbl">新規フォルダ</span>
    </button>
    <div class="resizer" id="rs-side" title="ドラッグで幅を変更"></div>
  </aside>

  <section id="center" class="panel">
    <header>
      <input id="q" type="search" placeholder="タイトル・チャンネル・タグで検索">
      <button id="q-mode" class="chip" title="検索対象を切り替え(ライブラリ内 / YouTube)">ライブラリ</button>
      <button id="add-video" class="chip accent" title="動画を登録">＋ 動画を追加</button>
      <button id="theme" class="chip" title="テーマ切り替え"></button>
    </header>
    <div id="list"></div>
  </section>

  <aside id="detail" class="panel" hidden>
    <div class="resizer left" id="rs-detail" title="ドラッグで幅を変更"></div>
    <div class="d-bar"><button id="d-close" class="icon-btn" title="閉じる(再生も停止します)" aria-label="閉じる">✕</button></div>
    <div class="player"><iframe id="player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <h2 id="d-title"></h2>
    <p id="d-meta"></p>
    <a id="d-open" target="_blank" rel="noopener">YouTubeで開く ↗</a>
    <details id="d-cmts" hidden>
      <summary>コメント<span id="d-cmts-n"></span></summary>
      <div id="d-cmts-body"></div>
    </details>
    <label class="pl-only">分類
      <select id="d-kind">
        <option value="own">作成した</option>
        <option value="saved">保存した</option>
        <option value="manual">URLで追加</option>
      </select>
    </label>
    <h3>しおり</h3>
    <ul id="d-bms"></ul>
    <form id="bm-form">
      <input id="bm-time" placeholder="1:25" size="6" required>
      <input id="bm-note" placeholder="メモ">
      <button class="chip">追加</button>
    </form>
    <h3>フォルダ</h3>
    <div id="d-folders"></div>
    <button id="d-delete" class="chip danger">この動画を削除</button>
  </aside>
</div>
<dialog id="add-dialog">
  <form method="dialog" id="add-form">
    <h3>動画を登録</h3>
    <p class="hint">YouTubeの動画URL(または動画ID)を貼り付けてください。複数は1行に1件ずつ入力できます。</p>
    <textarea id="add-urls" rows="5" placeholder="https://www.youtube.com/watch?v=...&#10;https://youtu.be/..." required></textarea>
    <label class="row">保存先フォルダ <select id="add-folder-sel"></select></label>
    <div class="actions">
      <button type="button" id="add-cancel" class="chip">キャンセル</button>
      <button type="submit" class="chip accent" id="add-submit">登録</button>
    </div>
  </form>
</dialog>
<dialog id="pl-dialog">
  <form method="dialog" id="pl-form">
    <h3>再生リストを追加</h3>
    <p class="hint">再生リストのURL(<code>...playlist?list=…</code>)を貼り付けてください。複数は1行に1件ずつ入力できます。非公開のリストは再生できません。</p>
    <textarea id="pl-urls" rows="4" placeholder="https://www.youtube.com/playlist?list=PL..." required></textarea>
    <div class="actions">
      <button type="button" id="pl-cancel" class="chip">キャンセル</button>
      <button type="submit" class="chip accent" id="pl-submit">追加</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status"></div>
<script src="src/manager.js"></script>
</body>
</html>
